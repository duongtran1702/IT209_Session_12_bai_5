<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="950" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .header-bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .tab-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #f85149; }
      .log-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6; }
      .log-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
      .err-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #f85149; font-weight: bold; }
    </style>
  </defs>

  <rect class="bg" width="950" height="480" rx="10" />

  <rect class="header-bar" width="950" height="45" rx="10 10 0 0" />
  <circle cx="25" cy="22" r="6" fill="#f85149" />
  <circle cx="45" cy="22" r="6" fill="#d29922" />
  <circle cx="65" cy="22" r="6" fill="#238636" />
  <text x="95" y="27" class="tab-title">LỖI 2: Authentication Failed - Job: docker-build / Step: Log in to Docker Registry</text>

  <rect x="25" y="65" width="900" height="390" class="log-bg" />

  <text x="50" y="105" class="log-txt">> Run docker/login-action@v3</text>
  <text x="50" y="130" class="log-txt">  Logging into ghcr.io with username: duongtran1702</text>
  <text x="50" y="165" class="err-txt">Error: Error response from daemon: Get "https://ghcr.io/v2/": unauthorized: authentication required</text>
  <text x="50" y="195" class="err-txt">Error: Username and password required or token expired.</text>
  <text x="50" y="225" class="err-txt">##[error]Docker login failed with exit code 1.</text>

  <!-- Explanation box inside log -->
  <rect x="50" y="260" width="850" height="170" fill="#161b22" stroke="#f85149" stroke-width="1.5" rx="6" />
  <text x="75" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f85149">🔍 PHÂN TÍCH NGUYÊN NHÂN GỐC RỄ (ROOT CAUSE ANALYSIS):</text>
  <text x="75" y="325" class="log-txt">• Tên biến secret bị gõ sai chính tả: ${{ secrets.REGISTRY_TOKKEN }} (thừa chữ cái K).</text>
  <text x="75" y="350" class="log-txt">• Biến secret không tồn tại khiến GitHub Actions đánh giá ra giá trị rỗng "" gửi tới registry.</text>
  <text x="75" y="385" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950">✅ GIẢI PHÁP KHẮC PHỤC:</text>
  <text x="75" y="410" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">Sửa lại đúng tên secret: password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}</text>
</svg>
